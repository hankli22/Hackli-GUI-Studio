plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { name = "meteor-maven"; url = uri("https://maven.meteordev.org/releases") }
    maven { name = "meteor-maven-snapshots"; url = uri("https://maven.meteordev.org/snapshots") }
}

dependencies {
    // Shared, Minecraft-independent core (model + layout math + exporters).
    // Its classes are bundled loosely into the mod jar (see the jar block).
    implementation project(":core")

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor Client — addon API entrypoint ("meteor")
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
}

processResources {
    def propertyMap = [
        "version"              : project.version,
        "minecraft_version"    : project.minecraft_version,
        "jdk_version"          : 21,
    ]
    inputs.properties(propertyMap)

    filesMatching("fabric.mod.json") {
        expand(propertyMap)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
}

jar {
    // Bundle the shared core classes loosely into the mod jar (they are not a
    // fabric mod, so they cannot travel as a nested jar).
    dependsOn ":core:classes"
    from(file("${project(":core").projectDir}/build/classes/java/main")) {
        include "com/hackli/guidesigner/**"
    }

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Prints the compile classpath (mapped Minecraft + Meteor + libs) so that
// plugin code generated by Hackli GUI Studio can be compiled outside the IDE:
//     ./gradlew printCompileClasspath
tasks.register("printCompileClasspath") {
    doLast {
        println sourceSets.main.compileClasspath.asPath
    }
}
